<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Daily Children's Data</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#1f2937}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}

h1{font-size:25px;margin:0 0 8px}
p{line-height:1.55;color:#4b5563}
.btn{display:block;width:100%;padding:14px 16px;margin-top:14px;border:0;border-radius:10px;text-decoration:none;font-weight:700;font-size:16px;cursor:pointer}
.primary{background:#1d4ed8;color:#fff}
.secondary{background:#eef2ff;color:#1d4ed8}
.small{font-size:12px;color:#6b7280;margin-top:18px}
.code{word-break:break-all;background:#f9fafb;border:1px solid #e5e7eb;padding:10px;border-radius:8px;font-size:12px;text-align:left;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Daily Children's Data Entry</h1>
    <p>Use the button below to open the daily submission application.</p>

    <a class="btn primary" href="https://script.google.com/a/*/macros/s/AKfycbx3yZC_dSNthFcX-crFjg5Qy2JG8vtO6eLgT1IOtx7r7Y9TPEseU4-pARXPKsgUE8Sw/exec" target="_top" rel="noopener">
      Open Daily Data Entry
    </a>

    <a class="btn secondary" href="https://script.google.com/macros/s/AKfycbx3yZC_dSNthFcX-crFjg5Qy2JG8vtO6eLgT1IOtx7r7Y9TPEseU4-pARXPKsgUE8Sw/exec" target="_top" rel="noopener">
      Standard Link (Fallback)
    </a>

    <div class="small">
      The first button uses Google's multi-account compatible Apps Script URL.
      This page intentionally does not embed the Google app in an iframe.
    </div>
  </div>
</div>
</body>
</html>
